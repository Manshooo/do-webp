# Единственный способ выпустить версию. Запускается руками из вкладки Actions.
#
# Порядок шагов важен: версия сначала только записывается в package.json,
# потом идёт публикация, и лишь после неё появляются коммит, тег и релиз.
# Если npm откажет, в репозитории не останется ни поднятой версии, ни тега —
# можно просто запустить workflow заново.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Что сделать с версией"
        required: true
        default: none
        type: choice
        options:
          - none # выпустить версию, которая уже записана в package.json
          - patch
          - minor
          - major
      version:
        description: "Точная версия, например 2.0.0. Если заполнено, поле выше игнорируется"
        required: false
        type: string

permissions:
  contents: write # запушить коммит с версией, тег и релиз
  id-token: write # OIDC для доверенной публикации в npm

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Нужны теги: шаги ниже проверяют, не занят ли тег этой версии.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      # Доверенная публикация (Trusted Publishing) работает с npm 11.5.1+.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm test

      # Значения из inputs передаём через env, а не подставляем в текст скрипта:
      # так их содержимое не может выполниться как команда.
      - name: Set version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          target="${EXACT:-$BUMP}"

          if [ "$target" != "none" ]; then
            npm version "$target" --no-git-tag-version
          fi

          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Готовим версию $version"

      - name: Check the tag is free
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "Тег $TAG уже существует и указывает на другой коммит."
              echo "Удалите тег или выберите другую версию."
              exit 1
            fi
            echo "Тег $TAG уже стоит на этом коммите, переиспользуем."
          fi

      - name: Check version is not published yet
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$VERSION" version > /dev/null 2>&1; then
            echo "Версия $VERSION уже опубликована в npm."
            echo "Выберите bump patch/minor/major или укажите точную версию."
            exit 1
          fi

      # Всё, что нужно сверить с настройкой Trusted Publisher на npmjs.com,
      # если публикация упадёт с ENEEDAUTH.
      - name: Diagnose publish auth
        run: |
          echo "npm            $(npm --version)   (для OIDC нужен 11.5.1 или новее)"
          echo "registry       $(npm config get registry)"
          echo "repository     $GITHUB_REPOSITORY"
          echo "workflow file  $(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC           токен доступен, права id-token: write есть"
          else
            echo "OIDC           недоступен: нет прав id-token: write"
          fi

      # Точка невозврата. Всё, что выше, можно перезапускать без последствий;
      # публикацию в npm отменить уже нельзя.
      #
      # Токен не нужен: авторизация идёт по OIDC через доверенного издателя,
      # настроенного на npmjs.com. npm сам приложит provenance к релизу.
      - name: Publish to npm
        run: npm publish

      - name: Commit, tag and push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "$TAG"

          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null \
            || git tag -a "$TAG" -m "$TAG"

          git push origin HEAD
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --generate-notes
